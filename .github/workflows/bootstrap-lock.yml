name: Bootstrap and verify source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, io, tarfile

          root = Path('.bootstrap')
          p0 = (root / 'part-00').read_text()
          p1 = (root / 'part-01').read_text()
          p2 = (root / 'part-02').read_text()
          damaged = (root / 'part-03').read_text()
          repaired_first_half = (root / 'part-03a').read_text()
          p4 = (root / 'part-04').read_text()

          # part-03 lost one Base64 character at offset 4447. part-03a is the
          # verified original first 9000-character half. Because the deletion
          # shifts the damaged stream by one, original byte 9000 starts at
          # damaged offset 8999.
          repaired_p3 = repaired_first_half + damaged[8999:]
          assert len(repaired_p3) == 18000

          encoded = p0 + p1 + p2 + repaired_p3 + p4
          assert len(encoded) % 4 == 0
          raw = base64.b64decode(encoded, validate=True)

          # Force complete gzip decompression so CRC/length are verified before
          # extraction; merely listing tar headers is not sufficient.
          decompressed = gzip.decompress(raw)
          with tarfile.open(fileobj=io.BytesIO(decompressed), mode='r:') as tf:
              names = tf.getnames()
              assert 'package.json' in names or './package.json' in names
              tf.extractall('.')
          print(f'Recovered {len(names)} files from {len(raw)}-byte source archive.')
          PY
          test -f package.json
          rm -rf .bootstrap .init

      - name: Install dependencies and create lockfile
        run: npm install

      - name: Dev server smoke test
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          PID=$!
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/latex-gym/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/vite.log; kill $PID || true; exit 1; fi
          curl -fsS http://127.0.0.1:5173/latex-gym/ >/dev/null
          kill $PID

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: latex-gym-verified-build
          path: |
            package-lock.json
            dist

      - name: Commit verified application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Build LaTeX gym application"
            git push origin HEAD:main
          fi
