name: Bootstrap and verify source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          head -c 9000 .bootstrap/part-03 > /tmp/part-03-head
          tail -c +9001 .bootstrap/part-03 > /tmp/part-03-tail

          try_archive() {
            name="$1"
            shift
            echo "Trying source archive: $name"
            cat "$@" > /tmp/latex-gym.b64
            if base64 --decode /tmp/latex-gym.b64 > /tmp/latex-gym.tgz 2>/tmp/base64.err && tar -tzf /tmp/latex-gym.tgz >/tmp/tar-list 2>/tmp/tar.err; then
              echo "Selected source archive: $name"
              tar -xzf /tmp/latex-gym.tgz
              return 0
            fi
            return 1
          }

          try_archive repaired-second-half \
            .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 \
            /tmp/part-03-head .bootstrap/part-03a .bootstrap/part-04 \
          || try_archive repaired-first-half \
            .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 \
            .bootstrap/part-03a /tmp/part-03-tail .bootstrap/part-04 \
          || try_archive legacy \
            .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 \
            .bootstrap/part-03 .bootstrap/part-04 \
          || { echo 'Unable to reconstruct source archive'; cat /tmp/base64.err || true; cat /tmp/tar.err || true; exit 1; }

          test -f package.json
          rm -rf .bootstrap .init

      - name: Install dependencies and create lockfile
        run: npm install

      - name: Dev server smoke test
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          PID=$!
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/latex-gym/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/vite.log
            kill $PID || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:5173/latex-gym/ >/dev/null
          kill $PID

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: latex-gym-verified-build
          path: |
            package-lock.json
            dist

      - name: Commit verified application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Build LaTeX gym application"
            git push origin HEAD:main
          fi
