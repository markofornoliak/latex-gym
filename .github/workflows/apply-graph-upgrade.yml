name: Apply graph validation upgrade

on:
  push:
    branches: [graph-validation-10-10]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: graph-validation-10-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-graph-upgrade.mjs
      - run: npm run curriculum:prepare
      - run: npm run curriculum:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit validated upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: harden curriculum dependency graph"
          git push origin HEAD:graph-validation-10-10
