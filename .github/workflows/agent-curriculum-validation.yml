name: Agent curriculum validation

on:
  push:
    branches: ['agent/curriculum-schema-validation']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate curriculum
        run: npm run curriculum:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Record successful validation
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          mkdir -p .github/validation
          printf 'validated_sha=%s\nstatus=passed\n' "$VALIDATED_SHA" > .github/validation/curriculum-schema.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/validation/curriculum-schema.txt
          git commit -m 'Record curriculum validation result'
          git push
