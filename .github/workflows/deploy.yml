name: Deploy LaTeX gym to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production visual and route QA
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/latex-gym-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/latex-gym/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/latex-gym-preview.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'A Chromium-compatible browser is required for visual QA.'
            exit 1
          fi

          mkdir -p qa-screenshots
          capture() {
            local name="$1" route="$2" width="$3" height="$4" expected="$5"
            local url="http://127.0.0.1:4173/latex-gym/#${route}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --run-all-compositor-stages-before-draw \
              --virtual-time-budget=2200 --window-size="${width},${height}" \
              --dump-dom "$url" > "/tmp/${name}.html"
            grep -Fq "$expected" "/tmp/${name}.html"
            ! grep -Fq 'Страница не найдена' "/tmp/${name}.html"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --run-all-compositor-stages-before-draw \
              --virtual-time-budget=2200 --window-size="${width},${height}" \
              --screenshot="qa-screenshots/${name}.png" "$url"
          }

          capture onboarding-390 / 390 844 'Тренируйся.'
          capture home-320 /home 320 780 'Продолжить обучение'
          capture home-390 /home 390 844 'План обучения'
          capture lesson-390 /lesson/document-structure 390 844 'Структура документа'
          capture practice-390 /practice/e01 390 844 'ЗАДАНИЕ 1 ИЗ 3'
          capture home-768 /home 768 1024 'План обучения'
          capture lesson-1440 /lesson/document-structure 1440 1000 'Структура документа'
          capture practice-1920 /practice/e01 1920 1080 'Проверить решение'

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v6
        with:
          name: latex-gym-visual-qa
          path: qa-screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
