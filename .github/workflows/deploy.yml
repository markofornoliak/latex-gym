name: Deploy LaTeX gym to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare BusyTeX smoke runtime
        run: node scripts/prepare-busytex.mjs smoke

      - name: Production compiler, behavior, route and visual QA
        shell: bash
        run: |
          set -euo pipefail

          cp scripts/qa/real-tex-matrix.html dist/compiler-smoke.html
          cp scripts/qa/behavior-smoke.html dist/behavior-smoke.html

          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/latex-gym-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/latex-gym/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/latex-gym-preview.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'A Chromium-compatible browser is required for production QA.'
            exit 1
          fi

          echo 'QA real TeX matrix: pdfLaTeX, XeLaTeX, LuaLaTeX and BibTeX'
          timeout 300s "$CHROME" --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=240000 --dump-dom \
            'http://127.0.0.1:4173/latex-gym/compiler-smoke.html' \
            > /tmp/real-tex-smoke.html 2> /tmp/real-tex-smoke.browser.log || true
          if ! grep -Fq 'REAL_TEX_MATRIX_PASS' /tmp/real-tex-smoke.html; then
            echo 'Real TeX engine matrix did not complete successfully.'
            cat /tmp/real-tex-smoke.html || true
            cat /tmp/real-tex-smoke.browser.log || true
            exit 1
          fi

          echo 'QA production compiler API: engines, multi-file, BibTeX, Biber rejection, cancellation and recovery'
          timeout 360s "$CHROME" --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=300000 --dump-dom \
            'http://127.0.0.1:4173/latex-gym/?qa=compiler-api' \
            > /tmp/compiler-api-smoke.html 2> /tmp/compiler-api-smoke.browser.log || true
          if ! grep -Fq 'COMPILER_API_SMOKE_PASS' /tmp/compiler-api-smoke.html; then
            echo 'Production compiler API smoke did not complete successfully.'
            cat /tmp/compiler-api-smoke.html || true
            cat /tmp/compiler-api-smoke.browser.log || true
            exit 1
          fi

          echo 'QA behavior: bookmark mutation, command-palette focus and SPA route focus'
          timeout 60s "$CHROME" --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=20000 --dump-dom \
            'http://127.0.0.1:4173/latex-gym/behavior-smoke.html' \
            > /tmp/behavior-smoke.html 2> /tmp/behavior-smoke.browser.log || true
          if ! grep -Fq 'BEHAVIOR_SMOKE_PASS' /tmp/behavior-smoke.html; then
            echo 'Behavioral smoke test failed.'
            cat /tmp/behavior-smoke.html || true
            cat /tmp/behavior-smoke.browser.log || true
            exit 1
          fi

          mkdir -p qa-screenshots
          capture() {
            local name="$1" route="$2" width="$3" height="$4" expected="$5"
            local url="http://127.0.0.1:4173/latex-gym/#${route}"
            local browser_log="/tmp/${name}.browser.log"
            local dom="/tmp/${name}.html"
            echo "QA ${name}: ${width}x${height} ${route}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --run-all-compositor-stages-before-draw \
              --virtual-time-budget=2400 --window-size="${width},${height}" \
              --dump-dom "$url" > "$dom" 2> "$browser_log"

            if ! grep -Fq "$expected" "$dom"; then
              echo "Expected text not found: ${expected}"
              tail -n 50 "$dom" || true
              cat "$browser_log" || true
              return 1
            fi
            if grep -Fq 'Страница не найдена' "$dom"; then
              echo "Route rendered the fallback page: ${route}"
              cat "$browser_log" || true
              return 1
            fi
            if grep -Eq 'Uncaught (TypeError|ReferenceError|SyntaxError)|CONSOLE.*ERROR' "$browser_log"; then
              echo "Browser reported a JavaScript error for ${route}"
              cat "$browser_log"
              return 1
            fi

            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --run-all-compositor-stages-before-draw \
              --virtual-time-budget=2400 --window-size="${width},${height}" \
              --screenshot="qa-screenshots/${name}.png" "$url" 2>> "$browser_log"
          }

          # Intentional device matrix: small phone, phone, tablet, laptop, desktop and TV/4K.
          capture phone-320-foundation /lesson/what-is-latex 320 568 'Что такое LaTeX'
          capture phone-360-practice /practice/deep-001 360 800 'ЗАДАНИЕ 1 ИЗ 3'
          capture phone-390-command /lesson/commands-foundation 390 844 'Команды'
          capture phone-390-project /project/academic-paper/stage-10 390 844 'Архитектура публикации'
          capture phone-430-first-document /lesson/first-document-foundation 430 932 'Первый документ'
          capture tablet-768-reference /reference/frac 768 1024 'Дробь'
          capture tablet-1024-project /project/academic-paper/stage-4 1024 1366 'Математическая модель'
          capture laptop-1280-lesson /lesson/table-anatomy 1280 800 'Анатомия tabular'
          capture desktop-1440-practice /practice/e01 1440 900 'Проверить решение'
          capture desktop-1920-project /project/academic-paper/stage-10 1920 1080 'Архитектура публикации'
          capture tv-2560-debug /lesson/debug-alignment-tab 2560 1440 'Extra alignment tab'
          capture tv-3840-project /project/technical-report/build 3840 2160 'Сборка'

          # Project QA protects the applied-workflow surface, not only the route heading.
          grep -Fq 'ФАЙЛЫ' /tmp/phone-390-project.html
          grep -Fq 'sections/introduction.tex' /tmp/phone-390-project.html
          grep -Fq 'ФАЙЛЫ' /tmp/desktop-1920-project.html
          grep -Fq 'sections/introduction.tex' /tmp/desktop-1920-project.html
          grep -Fq 'chapters/system.tex' /tmp/tv-3840-project.html
          grep -Fq 'Проверить этап' /tmp/tv-3840-project.html

          # A second load of the same deep route exercises reload/direct-route behavior.
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=1600 \
            --dump-dom 'http://127.0.0.1:4173/latex-gym/#/lesson/what-is-latex' > /tmp/reload.html 2>/tmp/reload.browser.log
          grep -Fq 'Что такое LaTeX' /tmp/reload.html
          ! grep -Fq 'Страница не найдена' /tmp/reload.html

      - name: Prepare full BusyTeX runtime for Pages
        if: github.event_name != 'pull_request'
        run: node scripts/prepare-busytex.mjs full

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v6
        with:
          name: latex-gym-visual-qa
          path: qa-screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5