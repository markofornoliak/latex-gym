name: Curriculum migration artifact
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upload generated curriculum migration files
        uses: actions/upload-artifact@v6
        with:
          name: curriculum-migration-files
          path: |
            src/data/curriculumExpansion.generated.ts
            src/data/deepCurriculum.generated.ts
            src/data/curriculumSnapshot.generated.json
          if-no-files-found: error
          retention-days: 1
