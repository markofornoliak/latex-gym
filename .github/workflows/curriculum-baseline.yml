name: Capture curriculum baseline

on:
  push:
    branches: [agent/curriculum-source-of-truth]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize current curriculum
        run: npm run curriculum:prepare

      - name: Upload semantic baseline
        uses: actions/upload-artifact@v6
        with:
          name: curriculum-baseline
          path: src/data/curriculumSnapshot.generated.json
          if-no-files-found: error
          retention-days: 1
