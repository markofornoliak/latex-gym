name: Capture curriculum baseline

on:
  push:
    branches: [agent/curriculum-source-of-truth]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize current curriculum
        run: npm run curriculum:prepare

      - name: Capture canonical educational source
        if: github.event_name == 'push'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const snapshot = JSON.parse(readFileSync('src/data/curriculumSnapshot.generated.json', 'utf8'));
          const source = {
            modules: snapshot.modules,
            concepts: snapshot.concepts,
            references: snapshot.references,
            projects: snapshot.projects
          };
          writeFileSync('src/data/curriculumSource.json', `${JSON.stringify(source)}\n`, 'utf8');
          writeFileSync('src/data/curriculumBaseline.json', `${JSON.stringify({
            snapshotVersion: snapshot.snapshotVersion,
            semanticFingerprint: snapshot.semanticFingerprint,
            moduleIds: snapshot.modules.map(item => item.id),
            lessonIds: snapshot.lessons.map(item => item.id),
            exerciseIds: snapshot.exercises.map(item => item.id),
            conceptIds: snapshot.concepts.map(item => item.id),
            referenceIds: snapshot.references.map(item => item.id),
            projectIds: snapshot.projects.map(item => item.id),
            projectStageIds: Object.fromEntries(snapshot.projects.map(project => [project.id, project.stages.map(stage => stage.id)]))
          })}\n`, 'utf8');
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/curriculumSource.json src/data/curriculumBaseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize canonical curriculum source'
            git push origin HEAD:agent/curriculum-source-of-truth
          fi

      - name: Upload semantic baseline
        uses: actions/upload-artifact@v6
        with:
          name: curriculum-baseline
          path: src/data/curriculumSnapshot.generated.json
          if-no-files-found: error
          retention-days: 1
