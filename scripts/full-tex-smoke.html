<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Full TeX smoke</title></head>
<body data-status="boot">boot
<script>
(async()=>{
  const root='/latex-gym/full-tex/';const body=document.body;let worker=null;let timer=null;const prints=[];
  const setStatus=(status,text)=>{body.dataset.status=status;body.textContent=text;};
  const fail=(message)=>{if(timer)clearTimeout(timer);setStatus('failed',`FULL_TEX_FAILED: ${message}${prints.length?` PRINT=${prints.slice(-8).join(' | ')}`:''}`);worker?.terminate();};
  setStatus('loading-engine','initializing pinned BusyTeX worker');
  worker=new Worker(`${root}busytex_worker.js`);
  worker.onerror=(event)=>fail(event.message||'worker error');
  worker.onmessage=(event)=>{
    const message=event.data||{};
    if(message.print){prints.push(String(message.print));return;}
    if(!Object.prototype.hasOwnProperty.call(message,'pdf')&&!Object.prototype.hasOwnProperty.call(message,'log'))return;
    if(timer)clearTimeout(timer);
    const length=message.pdf?.byteLength||0;const log=String(message.log||'');
    if(length>1000)setStatus('success',`FULL_TEX_OK PDF_BYTES=${length}`);
    else fail(`pdf=${length} log=${log.slice(0,1600)}`);
    worker.terminate();
  };
  const texliveJs=[`${root}texlive-basic.js`,`${root}ubuntu-texlive-latex-base.js`,`${root}ubuntu-texlive-latex-recommended.js`,`${root}ubuntu-texlive-latex-extra.js`];
  worker.postMessage({busytex_js:`${root}busytex.js`,busytex_wasm:`${root}busytex.wasm`,texlive_js:texliveJs,texmf_local:[],preload:true,verbose:'silent'});
  setStatus('compiling','initializing engine and compiling minimal document');
  timer=setTimeout(()=>fail('engine/document compilation timed out'),300000);
  worker.postMessage({files:[{path:'main.tex',contents:'\\documentclass{article}\n\\begin{document}\nFull Compile works. $E=mc^2$.\n\\end{document}\n'}],main_tex_path:'main.tex',verbose:'silent',bibtex:null});
})().catch(error=>{document.body.dataset.status='failed';document.body.textContent=`FULL_TEX_FAILED: ${error?.stack||error?.message||error}`;});
</script>
</body>
</html>
